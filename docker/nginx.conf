# ==============================================================================
# NeuroScan AI - Nginx Reverse Proxy Gateway Configuration
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 700M; # Cho phép upload gói DICOM & ảnh MRI lát cắt dung lượng lớn đến 500MB+

    # Ẩn phiên bản máy chủ Nginx
    server_tokens off;

    # Gắn Security Headers toàn hệ thống tại tầng Gateway
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    upstream backend_service {
        server backend:5000;
    }

    upstream ai_service {
        server ai-service:8000;
    }

    upstream frontend_service {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Bắt buộc chuyển hướng sang HTTPS khi phát hiện truy cập HTTP không bảo mật
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        # 1. Định tuyến API Backend
        location /api/ {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Tối ưu upload file MRI lớn: Stream trực tiếp từ socket đến Backend, không ghi đĩa trung gian
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
        }

        # 1b. Định tuyến Xác thực Auth & Healthcheck
        location /auth/ {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 1c. Định tuyến Quản trị Hệ thống Admin & EMR Lâm sàng
        location /admin/ {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /emr/ {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ping {
            proxy_pass http://backend_service/ping;
            proxy_set_header Host $host;
        }

        # 2. Định tuyến File Tải lên (Key Slices & DICOM Archives)
        location /uploads/ {
            proxy_pass http://backend_service/uploads/;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # 3. Định tuyến AI FastAPI Engine
        location /ai/ {
            rewrite ^/ai/(.*) /$1 break;
            proxy_pass http://ai_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 180s;
        }

        # 4. Định tuyến Giao diện Người dùng (Expo SPA)
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
